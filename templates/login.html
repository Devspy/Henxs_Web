<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Henxs AI Vision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <img class="login-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Henxs AI Vision">
            <div class="login-heading">
                <p class="login-eyebrow">INTELLIGENT SURVEILLANCE</p>
                <h1 id="login-title">AI Security Command</h1>
                <p>Access FRS, ANPR, and community CCTV intelligence.</p>
            </div>

            {% if error %}
                <div class="login-error" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" class="login-form">
                <label for="username">Operator ID</label>
                <div class="login-input">
                    <i class="fa-regular fa-user"></i>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter login ID" required autofocus>
                </div>

                <label for="password">Password</label>
                <div class="login-input">
                    <i class="fa-solid fa-lock"></i>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
                </div>

                <button class="login-button" type="submit">
                    Sign in
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </section>
    </main>
</body>
</html>
